{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <h1>
    {% block form_header %}
      {{ object|yesno:"Update,Create" }} task
    {% endblock %}
  </h1>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input class="btn btn-success" type="submit" value="Submit">
  </form>
{% endblock %}
